<!doctype html><html lang="tk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyTestXPro — Mugallym paneli</title><style>body{margin:0;background:#081521;color:#f4f7f9;font:15px system-ui,Arial}main{max-width:1200px;margin:auto;padding:28px 18px}h1{color:#f4c27a}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{background:#132a3d;padding:10px 14px;border-radius:12px}.muted{color:#8fa4b3}button{background:#e7a33c;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.table{overflow:auto;margin-top:18px;background:#0f2233;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;text-align:left;border-bottom:1px solid #254257}th{color:#f4c27a}.ok{color:#8fe0b6}.bad{color:#f4977b}.empty{text-align:center;padding:38px;color:#8fa4b3}</style></head><body><main><div class="bar"><h1>🧑‍🏫 MyTestXPro Mugallym paneli</h1><button id="refresh">Täzele</button></div><div class="bar" id="stats"></div><div class="table"><table><thead><tr><th>Ady</th><th>Familiýasy</th><th>Topary</th><th>Synag</th><th>Wagty</th><th>Baha</th><th>Netije</th><th>Dogry/Ýalňyş</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const rs=await fetch('/api/results').then(r=>r.json());const f=rs.filter(x=>x.event==='finish');document.getElementById('stats').innerHTML='<span class="pill">Jemi synag: '+f.length+'</span><span class="pill">Geçen: '+f.filter(x=>x.status==='Geçdi').length+'</span><span class="pill">Ortaça: '+(f.length?Math.round(f.reduce((a,x)=>a+(+x.pct||0),0)/f.length):0)+'%</span>';document.getElementById('rows').innerHTML=f.length?f.map(x=>'<tr><td>'+esc(x.studentName)+'</td><td>'+esc(x.studentSurname)+'</td><td>'+esc(x.group)+'</td><td>'+esc(x.testTitle)+'</td><td>'+new Date(x.finishedAt||x.receivedAt).toLocaleString('tk-TM')+'</td><td>'+esc(x.pct)+'% / '+esc(x.grade)+'</td><td class="'+(x.status==='Geçdi'?'ok':'bad')+'">'+esc(x.status)+'</td><td>'+esc(x.okN)+' / '+esc(x.badN)+' / '+esc(x.skipN)+'</td></tr>').join(''):'<tr><td colspan="8" class="empty">Heniz tamamlanan synag ýok.</td></tr>'}document.getElementById('refresh').onclick=load;load();setInterval(load,10000)</script></body></html>
